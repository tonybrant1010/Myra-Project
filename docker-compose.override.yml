services:
  backend:
    environment:
      ENVIRONMENT: "${ENVIRONMENT:-production}"
      TRUST_PROXY: "${TRUST_PROXY:-false}"
      PROFILE_ENABLED: "${PROFILE_ENABLED:-true}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      OLLAMA_TIMEOUT_S: "${OLLAMA_TIMEOUT_S:-300}"
      LOCAL_LLM_BRANCH: "${LOCAL_LLM_BRANCH:-0}"
      LOCAL_LLM_MODE: "${LOCAL_LLM_MODE:-fallback}"
      LOCAL_FALLBACK_TIMEOUT_S: "${LOCAL_FALLBACK_TIMEOUT_S:-120}"
      LOCAL_LLM_API_KEY: "${LOCAL_LLM_API_KEY:-}"
      LLM_METRICS: "${LLM_METRICS:-0}"
      TTS_ENGINE: "${TTS_ENGINE:-piper}"
      PIPER_BINARY: "${PIPER_BINARY:-/app/data/piper/piper}"
      PIPER_MODEL: "${PIPER_MODEL:-/app/data/tts/hu_HU-anna-medium.onnx}"
      FASTEMBED_CACHE_PATH: "${FASTEMBED_CACHE_PATH:-/app/data/fastembed}"
      FASTEMBED_MODEL_NAME: "${FASTEMBED_MODEL_NAME:-intfloat/multilingual-e5-large}"
      EMBED_DIM: "${EMBED_DIM:-1024}"
      EMBED_QUERY_PREFIX: "${EMBED_QUERY_PREFIX:-query: }"
      EMBED_PASSAGE_PREFIX: "${EMBED_PASSAGE_PREFIX:-passage: }"
      RAG_RERANKER_MODEL: "${RAG_RERANKER_MODEL:-BAAI/bge-reranker-base}"
      RAG_RERANK_POOL: "${RAG_RERANK_POOL:-12}"
      RAG_RERANK_DOC_CHARS: "${RAG_RERANK_DOC_CHARS:-500}"
      RAG_RERANK_THREADS: "${RAG_RERANK_THREADS:-4}"
      RAG_RERANK_MIN_SCORE: "${RAG_RERANK_MIN_SCORE:--100}"
      RAG_VECTOR_MAX_DISTANCE: "${RAG_VECTOR_MAX_DISTANCE:-1.0}"
      RAG_CANDIDATE_POOL: "${RAG_CANDIDATE_POOL:-60}"
      RAG_CHAT_CHUNKS: "${RAG_CHAT_CHUNKS:-6}"
      RAG_CHUNK_MAX_CHARS: "${RAG_CHUNK_MAX_CHARS:-1500}"
      RAG_CHUNK_OVERLAP: "${RAG_CHUNK_OVERLAP:-250}"
      RAG_CHUNK_MIN_CHARS: "${RAG_CHUNK_MIN_CHARS:-300}"
