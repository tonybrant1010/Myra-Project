services:

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: myra-docker-socket-proxy
    restart: unless-stopped

    environment:

      - CONTAINERS=1
      - POST=1
      - ALLOW_STOP=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: myra-backend
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: 6g
    ports:

      - "127.0.0.1:8001:8001"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      docker-socket-proxy:
        condition: service_started
      db:
        condition: service_healthy

    environment:
      - JWT_SECRET=${JWT_SECRET:?set in .env}
      - JWT_ALG=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=10080
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set in .env}
      - DATABASE_SSL=${DATABASE_SSL:-true}
      - DATABASE_SSL_MODE=${DATABASE_SSL_MODE:-require}
      - ADMIN_EMAIL_ALLOWLIST=${ADMIN_EMAIL_ALLOWLIST:-}
      - TRUST_PROXY=${TRUST_PROXY:-true}
      - MYRA_PROXY_SECRET=${MYRA_PROXY_SECRET:?set in .env}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}

      - MYRA_SMTP_HOST=${MYRA_SMTP_HOST:-smtp.protonmail.ch}
      - MYRA_SMTP_PORT=${MYRA_SMTP_PORT:-587}
      - MYRA_SMTP_USER=${MYRA_SMTP_USER:-}
      - MYRA_SMTP_PASSWORD=${MYRA_SMTP_PASSWORD:-}
      - MYRA_SMTP_SECURITY=${MYRA_SMTP_SECURITY:-starttls}
      - MYRA_SMTP_TLS_VERIFY=${MYRA_SMTP_TLS_VERIFY:-true}
      - MYRA_MAIL_FROM=${MYRA_MAIL_FROM:-noreply@myra-project.hu}
      - MYRA_MAIL_FROM_NAME=${MYRA_MAIL_FROM_NAME:-Myra-project}
      - MYRA_CONTACT_EMAIL=${MYRA_CONTACT_EMAIL:-info@myra-project.hu}
      - MYRA_ALERT_EMAIL=${MYRA_ALERT_EMAIL:-}
      - DOCKER_SOCKET_PROXY_URL=http://docker-socket-proxy:2375

      - CHAT_HISTORY_MAX_MESSAGES=${CHAT_HISTORY_MAX_MESSAGES:-120}
      - CHAT_HISTORY_MAX_CHARS=${CHAT_HISTORY_MAX_CHARS:-45000}
      - RAG_CHAT_CHUNKS=${RAG_CHAT_CHUNKS:-5}
      - RAG_VECTOR_MAX_DISTANCE=${RAG_VECTOR_MAX_DISTANCE:-0.62}
      - RAG_CANDIDATE_POOL=${RAG_CANDIDATE_POOL:-20}
      - RAG_KEEPWARM_INTERVAL_S=${RAG_KEEPWARM_INTERVAL_S:-240}

      - RAG_CHUNK_MAX_CHARS=${RAG_CHUNK_MAX_CHARS:-400}
      - RAG_CHUNK_OVERLAP=${RAG_CHUNK_OVERLAP:-80}

      - TTS_ENGINE=${TTS_ENGINE:-piper}
    volumes:
      - ./backend/data:/app/data
      - ./control:/control
      - ${BACKUP_HOST_DIR:-./backups}:/app/backups:ro

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/api/config').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

      start_period: 900s

  proton-bridge:
    profiles: ["bridge"]
    build:
      context: ./ops/proton-bridge
      dockerfile: Dockerfile
      args:
        BRIDGE_VERSION: ${BRIDGE_VERSION:-3.27.1}
    container_name: myra-proton-bridge
    restart: unless-stopped

    ports:
      - "127.0.0.1:1025:25"
    environment:

      - BRIDGE_SYNC_FORCE_MINIMUM_SPEC=1
    volumes:

      - proton-bridge-data:/root

    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/1025' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3

      start_period: 300s

  db:
    image: pgvector/pgvector:pg17
    container_name: myra-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: myra
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: myra
    volumes:
      - /var/lib/postgresql/data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myra -d myra"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1460

volumes:
  proton-bridge-data:
